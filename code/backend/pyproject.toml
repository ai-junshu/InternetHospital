[project]
name = "ihm-backend"
version = "0.1.0"
description = "互联网医疗中心平台 · 业务后端（FastAPI）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.41",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "pymongo>=4.7",
    "clickhouse-driver>=0.2.7",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    # 落库加密（KMS 信封加密 / 字段级加密，本次）：AES-256-GCM 认证加密
    "cryptography>=42",
]

# P5 性能容灾：压测 harness（仅开发/CI 使用，非运行时依赖）
[project.optional-dependencies]
dev = [
    "locust>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
