[project]
name = "ihm-ai-service"
version = "0.1.0"
description = "互联网医疗中心平台 · AI 推理服务（FastAPI + MLflow）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mlflow>=2.13",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    # 以下为重依赖，按需安装（开发/训练环境）：
    # "torch>=2.2",
    # "langchain>=0.2",
    # "transformers>=4.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
