# 共享 Node CI 模板（mp-taro / admin-web 复用）
# 技术架构第12章：ESLint → 单元测试 → 构建镜像 → 推送
name: CI Node

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
        description: "服务名，如 mp-taro / admin-web"
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      node-version:
        required: false
        type: string
        default: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint (eslint)
        run: npm run lint --if-present

      - name: Test (jest)
        run: npm test --if-present || echo "no test"

      - name: Build
        run: npm run build --if-present || echo "no build"

      - name: Build image
        run: docker build -f ${{ inputs.dockerfile }} -t ${{ inputs.service }}:${{ github.sha }} .
