# 互联网医疗中心平台 · 本地依赖一键编排
# 用法：在 code/infra 目录执行 `docker compose up -d`
# 包含：PostgreSQL(+pgvector) / Redis / MongoDB / ClickHouse / MinIO / Jaeger / Prometheus / Grafana
# 说明：本编排仅用于本地开发，生产环境由 code/infra/k8s Helm 部署（见 README）。

name: ihm-local

networks:
  ihm-net:
    driver: bridge

volumes:
  pg-data:
  redis-data:
  mongo-data:
  clickhouse-data:
  minio-data:
  prometheus-data:
  grafana-data:
  milvus-etcd-data:
  milvus-storage-data:

services:
  # ---------- 业务主库 + 向量 ----------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ihm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-ihm}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-ihm_dev_pwd}
      POSTGRES_DB: ${PG_DATABASE:-ihm}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # 启动时启用 pgvector 扩展（技术架构第5/7章）
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    networks:
      - ihm-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-ihm} -d ${PG_DATABASE:-ihm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 缓存 / 会话 / 限流 ----------
  redis:
    image: redis:7-alpine
    container_name: ihm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - ihm-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 文档 / 半结构化 ----------
  mongo:
    image: mongo:6
    container_name: ihm-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ihm}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-ihm_dev_pwd}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ihm}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ihm-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- OLAP 经营看板 ----------
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: ihm-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-ihm}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ihm}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-ihm_dev_pwd}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      # 经营宽表 mt_store_metrics DDL 占位（技术架构第11.3章）
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ihm-net
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  # ---------- 对象存储（生产 OSS/COS，本地 MinIO 等价替代，第14.4章） ----------
  minio:
    image: minio/minio:latest
    container_name: ihm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ihm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ihm_dev_pwd}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - ihm-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 链路追踪（OpenTelemetry + Jaeger，第15.5章） ----------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: ihm-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    networks:
      - ihm-net

  # ---------- 指标采集 ----------
  prometheus:
    image: prom/prometheus:latest
    container_name: ihm-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - ihm-net

  # ---------- 看板可视化 ----------
  grafana:
    image: grafana/grafana:latest
    container_name: ihm-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - ihm-net

  # ===================== 以下为数据中台扩展组件（P3，2026-08-01 增补） =====================
  # 说明：生产由 code/infra/k8s Helm 编排；本地按需在 `docker compose up -d` 后单独拉起：
  #   docker compose up -d iceberg-rest milvus
  # Spark / Flink 为重型可选组件，仅保留注释模板，不默认拉起。

  # ---------- 数据湖 Iceberg（REST Catalog，借助已有 minio 作存储） ----------
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    container_name: ihm-iceberg-rest
    restart: unless-stopped
    environment:
      CATALOG_WAREHOUSE: s3://iceberg/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ihm}
      CATALOG_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ihm_dev_pwd}
      CATALOG_S3_PATH_STYLE_ACCESS: "true"
    ports:
      - "${ICEBERG_REST_PORT:-8181}:8181"
    depends_on:
      - minio
    networks:
      - ihm-net

  # ---------- 向量检索 Milvus（standalone：etcd + storage + milvus） ----------
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: ihm-milvus-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - ihm-net

  milvus-storage:
    image: minio/minio:latest
    container_name: ihm-milvus-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_USER:-milvus}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_PASSWORD:-milvus_dev_pwd}
    volumes:
      - milvus-storage-data:/data
    networks:
      - ihm-net

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: ihm-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-storage:9000
      MINIO_ACCESS_KEY: ${MILVUS_MINIO_USER:-milvus}
      MINIO_SECRET_KEY: ${MILVUS_MINIO_PASSWORD:-milvus_dev_pwd}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
    depends_on:
      - milvus-etcd
      - milvus-storage
    networks:
      - ihm-net

  # ---------- 可选：批/流计算（重型，默认不拉起，按需取消注释） ----------
