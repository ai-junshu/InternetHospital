global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 后端指标（技术架构第15.5章：FastAPI 暴露 /metrics，由 prometheus-client 提供）
  - job_name: 'ihm-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:8000']
